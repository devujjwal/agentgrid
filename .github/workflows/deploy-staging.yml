name: Deploy staging application

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character main commit to validate and deploy to staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agentgrid-staging-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'devujjwal/agentgrid' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_SEND_ERROR_REPORTS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.2.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: node scripts/audit-dependencies.mjs
      - run: pnpm check
      - run: pnpm build:backend
      - run: pnpm test:backend
      - run: pnpm test:database
      - name: Deploy the verified staging application
        run: node scripts/deploy-staging.mjs
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Retain the verified private deployment receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-release-${{ github.sha }}
          path: staging-release-receipt.json
          if-no-files-found: error
          retention-days: 30
